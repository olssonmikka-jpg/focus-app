<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141414">
<title>Project Tracker</title>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>
  :root{
    --paper:#FAFAF8; --ink:#141414; --gray:#8a8a86; --hair:#e3e3df; --faint:#f0f0ec;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--paper)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 60px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--gray);text-transform:uppercase}
  .title{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin-top:2px;word-break:break-word}
  .sub{font-size:14px;color:var(--gray);margin-top:4px}
  .phead{padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
  input,textarea,select{font-family:inherit;color:var(--ink);background:transparent;outline:none;border:none}
  .fld{width:100%;font-size:20px;font-weight:800;border-bottom:1.5px dashed var(--hair);padding:4px 0}
  .fld:focus{border-color:var(--ink)}
  /* tabs */
  .tabs{display:flex;border:1.6px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:18px}
  .tabbtn{flex:1;background:none;border:none;padding:11px;font-size:13px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink);cursor:pointer}
  .tabbtn+.tabbtn{border-left:1.6px solid var(--ink)}
  .tabbtn.active{background:var(--ink);color:var(--paper)}
  .hint{font-size:11px;color:var(--gray);margin-top:6px}
  /* stat grid */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
  .stat{border:1.6px solid var(--ink);border-radius:6px;padding:10px 8px;text-align:center}
  .stat .n{font-size:20px;font-weight:800;overflow-wrap:anywhere}
  .stat .l{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--gray);text-transform:uppercase;margin-top:2px}
  .stat.wide{grid-column:1 / -1}
  .stat.wide .n{font-size:26px}
  /* jobs */
  .sechead{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1.5px solid var(--ink);margin-bottom:2px}
  .seclabel{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .addbtn{border:none;background:none;color:var(--gray);font-size:20px;font-weight:600;width:32px;height:28px;cursor:pointer}
  .addbtn:active{color:var(--ink)}
  .empty{padding:16px 2px;font-size:13px;color:var(--gray);font-style:italic}
  .job{border:1.6px solid var(--ink);border-radius:8px;margin-top:12px;overflow:hidden}
  .jhead{display:flex;align-items:center;gap:10px;padding:12px 12px;cursor:pointer}
  .jtitle{flex:1;min-width:0;font-size:17px;font-weight:800;border-bottom:1.5px dashed transparent;padding:2px 0;overflow-wrap:anywhere}
  .jtitle:focus{border-color:var(--gray)}
  .pill{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    border:1.3px solid var(--ink);border-radius:20px;padding:3px 9px;background:none;cursor:pointer}
  .pill.done{background:var(--ink);color:var(--paper)}
  .pill.active{border-style:solid}
  .pill.planned{border-style:dashed;color:var(--gray);border-color:var(--gray)}
  .chev{flex:0 0 auto;font-size:11px;color:var(--gray);transition:transform .15s}
  .job.open .chev{transform:rotate(180deg)}
  .jtotal{flex:0 0 auto;font-size:15px;font-weight:800}
  .jbody{display:none;border-top:1px solid var(--hair);padding:10px 12px 14px}
  .job.open .jbody{display:block}
  .jsubstats{display:flex;gap:14px;padding:8px 0 10px;font-size:12px;color:var(--gray);flex-wrap:wrap}
  .jsubstats b{color:var(--ink);font-weight:800}
  .subsec{margin-top:12px}
  .subhead{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--gray);text-transform:uppercase;
    padding-bottom:4px;border-bottom:1px dashed var(--hair)}
  .erow{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-bottom:1px solid var(--hair);font-size:14px}
  .erow .ed{flex:0 0 auto;color:var(--gray);font-size:12px;width:64px}
  .erow .et{flex:1;min-width:0;overflow-wrap:anywhere}
  .edim{color:var(--gray);font-size:12px}
  .erow .ev{flex:0 0 auto;font-weight:700}
  .erow .erm{flex:0 0 auto;border:none;background:none;color:var(--gray);font-size:15px;width:22px;cursor:pointer}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px 2px;align-items:center}
  .addrow input{border:1.3px solid var(--hair);border-radius:5px;padding:8px 9px;font-size:14px;background:#fff}
  .addrow input:focus{border-color:var(--ink)}
  .addrow .idate{flex:0 0 auto;width:132px}
  .addrow .inum{flex:0 0 auto;width:76px}
  .addrow .itext{flex:1 1 120px;min-width:100px}
  .addrow .iadd{flex:0 0 auto;background:var(--ink);color:var(--paper);border:none;border-radius:5px;
    width:36px;height:36px;font-size:18px;font-weight:700;cursor:pointer}
  .jdel{width:100%;margin-top:14px;background:none;border:1.3px solid var(--hair);color:var(--gray);
    border-radius:6px;padding:9px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .jdel:active{border-color:var(--ink);color:var(--ink)}
  /* file icon (per-line attachment) */
  .fileicon{position:relative;flex:0 0 auto;width:22px;height:22px;display:inline-flex;align-items:center;
    justify-content:center;color:var(--gray);cursor:pointer;text-decoration:none}
  .fileicon svg{width:14px;height:14px}
  .fileicon:active{color:var(--ink)}
  .fileicon.linked{color:var(--ink)}
  .fileicon input{position:absolute;inset:0;opacity:0;cursor:pointer}
  /* notes */
  .ntrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--hair)}
  .ntinput{flex:1;min-width:0;font-size:14px;padding:2px 0;border-bottom:1.5px dashed transparent}
  .ntinput:focus{border-color:var(--gray)}
  .nttext{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
  .ntrm{flex:0 0 auto;border:none;background:none;color:var(--gray);font-size:15px;width:20px;cursor:pointer}
  /* tasks */
  .trow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--hair)}
  .tbox{flex:0 0 auto;width:19px;height:19px;border:1.6px solid var(--ink);border-radius:3px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--paper)}
  .trow.done .tbox{background:var(--ink)}
  .ttext{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
  .trow.done .ttext{color:var(--gray);text-decoration:line-through}
  .trm{flex:0 0 auto;border:none;background:none;color:var(--gray);font-size:15px;width:20px;cursor:pointer}
  /* ledger (cost tab), grouped by day */
  .ledger{margin-top:4px}
  .dayhead{font-size:13px;font-weight:800;padding:10px 2px 6px;border-bottom:1.5px solid var(--ink);margin-top:20px}
  .dayhead:first-child{margin-top:0}
  .daybody{margin-bottom:2px}
  .lcrow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--hair);font-size:13px}
  .lcrow .lct{flex:1;min-width:0;overflow-wrap:anywhere}
  .lcrow .lca{flex:0 0 auto;font-weight:700}
  .lcrm{flex:0 0 auto;border:none;background:none;color:var(--gray);font-size:14px;width:18px;cursor:pointer}
  /* actions */
  .actions{margin-top:26px;display:flex;flex-direction:column;gap:10px}
  .btn{width:100%;padding:14px;border-radius:7px;font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer;text-align:center}
  .btn.primary{background:var(--ink);color:var(--paper);border:none;text-transform:uppercase}
  .btn.line{background:none;border:1.4px solid var(--ink);color:var(--ink)}
  .btn:active{opacity:.8}
  .sharebox{border:1.6px dashed var(--ink);border-radius:8px;padding:14px;margin-top:20px}
  .sharelbl{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
  .shareurl{font-size:12px;word-break:break-all;color:var(--ink);background:var(--faint);border-radius:5px;padding:8px 10px;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  /* landing */
  .plist{margin-top:10px}
  .prow{display:block;border:1.6px solid var(--ink);border-radius:8px;padding:12px 14px;margin-bottom:10px;
    text-decoration:none;color:var(--ink)}
  .prow .pn{font-size:16px;font-weight:800}
  .prow .pc{font-size:13px;color:var(--gray);margin-top:2px}
  .newform{border:1.6px dashed var(--ink);border-radius:8px;padding:14px;margin-top:16px}
  .newform input{display:block;width:100%;font-size:16px;border-bottom:1.3px solid var(--hair);padding:9px 2px;margin-bottom:10px}
  .newform input:focus{border-color:var(--ink)}
  .center{text-align:center;color:var(--gray);font-size:14px;padding:40px 0}
  /* print sheet: hidden on screen, shown on print */
  #printSheet{display:none}
  @media print{
    html,body{background:#fff}
    body *{visibility:hidden}
    #printSheet, #printSheet *{visibility:visible}
    #printSheet{display:block;position:absolute;top:0;left:0;width:100%;padding:0;color:#000}
    .psh1{font-size:22px;font-weight:800}
    .psh2{font-size:13px;color:#444;margin-top:2px}
    .psmeta{font-size:11px;color:#666;margin-top:10px;border-bottom:2px solid #000;padding-bottom:10px}
    .psjob{margin-top:18px;page-break-inside:avoid}
    .psjtitle{font-size:15px;font-weight:800;border-bottom:1.5px solid #000;padding-bottom:4px;display:flex;justify-content:space-between}
    .pstable{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}
    .pstable th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#666;
      border-bottom:1px solid #999;padding:4px 6px}
    .pstable td{padding:4px 6px;border-bottom:1px solid #ddd}
    .pstable td.num{text-align:right;white-space:nowrap}
    .psjtotals{display:flex;gap:16px;margin-top:6px;font-size:11px;font-weight:700}
    .pstasks{margin-top:6px;font-size:11px;color:#333}
    .psstatement{margin-top:24px}
    .psgrand{margin-top:24px;border-top:2px solid #000;padding-top:10px}
    .psgrand table{width:100%;font-size:13px}
    .psgrand td{padding:3px 0}
    .psgrand td.num{text-align:right;font-weight:800}
    .psnote{font-size:10px;color:#777;margin-top:24px}
  }
</style>
</head>
<body>
<div id="app"><div class="center">Loading…</div></div>
<div id="printSheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  function esc(s){ const d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  const CLIP_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05L12.25 20.24a6 6 0 01-8.49-8.49L12.75 2.56a4 4 0 015.66 5.66L9.5 17.13a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>';
  const LINK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  function fileIconHtml(kind, jobId, itemId, file){
    if(file && file.url){
      return '<a class="fileicon linked" href="'+esc(file.url)+'" target="_blank" rel="noopener" title="'+esc(file.name)+'" onclick="event.stopPropagation()">'+LINK_SVG+'</a>';
    }
    if(isView) return '';
    return '<label class="fileicon" data-filekind="'+kind+'" data-job="'+jobId+'" data-item="'+itemId+'" onclick="event.stopPropagation()">'+CLIP_SVG+
      '<input type="file" data-fileupload="1"></label>';
  }
  function newProjectId(){ return Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6); }
  function money(n){
    n = Number(n)||0;
    const sign = n<0 ? "-" : "";
    return sign+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function hrsFmt(n){ n = Number(n)||0; return (Math.round(n*100)/100)+"h"; }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function dateFmt(s){
    if(!s) return "";
    const p = s.split("-"); if(p.length!==3) return s;
    const d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
  }
  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.classList.remove("show"), 2000);
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>toast("Link copied")).catch(()=>fallbackCopy(text));
    } else fallbackCopy(text);
  }
  function fallbackCopy(text){
    prompt("Copy this link:", text);
  }

  /* ---------- firebase (same project as the Daily Focus app) ---------- */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCQwd7wLx5iLNjwaeQD9JaFORJFbrleIsU",
    authDomain: "focus-app-5be8b.firebaseapp.com",
    projectId: "focus-app-5be8b",
    storageBucket: "focus-app-5be8b.firebasestorage.app",
    messagingSenderId: "749902078589",
    appId: "1:749902078589:web:cb8435eafcb7524d870714"
  };
  let fbReady = null;
  async function ensureFirebase(){
    if(fbReady) return fbReady;
    fbReady = (async () => {
      if(typeof firebase === "undefined") throw new Error("no sdk");
      firebase.initializeApp(FIREBASE_CONFIG);
      await firebase.auth().signInAnonymously();
      return true;
    })().catch(() => null);
    return fbReady;
  }
  function projRef(id){ return firebase.firestore().collection("clientProjects").doc(id); }

  async function uploadFile(file, jobId){
    const ok = await ensureFirebase();
    if(!ok) return null;
    const id = uid();
    const path = "projects/"+projectId+"/"+jobId+"/"+id+"_"+file.name;
    const ref = firebase.storage().ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    return { id, name: file.name, url, path };
  }
  async function deleteFile(path){
    try{ await firebase.storage().ref(path).delete(); }catch(e){}
  }

  /* ---------- recents (local index of projects this browser knows about) ---------- */
  const RECENTS_KEY = "cp-recents";
  function getRecents(){ try{ return JSON.parse(localStorage.getItem(RECENTS_KEY))||[]; }catch(e){ return []; } }
  function saveRecent(id, name, client, role){
    let list = getRecents().filter(r => r.id !== id);
    list.unshift({id, name, client, role});
    localStorage.setItem(RECENTS_KEY, JSON.stringify(list.slice(0,20)));
  }

  /* ---------- state ---------- */
  const params = new URLSearchParams(location.search);
  const projectId = params.get("id");
  const isView = params.get("view") === "1";
  let project = null;
  let lastLocalWriteAt = 0;
  let saveTimer = null;
  const expanded = new Set();
  let activeTab = "projects";

  function emptyProject(name, client){
    return { name: name||"Untitled Project", client: client||"", jobs: [], payments: [], notes: [], updatedAt: Date.now() };
  }

  function jobTotals(job){
    const hours = (job.time||[]).reduce((s,e)=>s+(Number(e.hours)||0),0);
    const labor = (job.time||[]).reduce((s,e)=>s+(Number(e.hours)||0)*(Number(e.rate)||0),0);
    const materials = (job.materials||[]).reduce((s,e)=>s+(Number(e.cost)||0),0);
    return { hours, materials, labor, total: labor+materials };
  }

  function buildLedger(){
    const rows = [];
    (project.jobs||[]).forEach(job => {
      const jt = job.title || "Untitled Job";
      (job.time||[]).forEach(e => rows.push({
        id:e.id, date:e.date, kind:"time",
        desc: jt + (e.desc ? " — "+e.desc : ""),
        rate: Number(e.rate)||0,
        hours: Number(e.hours)||0,
        amount: (Number(e.hours)||0) * (Number(e.rate)||0)
      }));
      (job.materials||[]).forEach(e => rows.push({
        id:e.id, date:e.date, kind:"materials",
        desc: jt + " — " + (e.desc||"Materials"),
        rate: null,
        amount: Number(e.cost)||0
      }));
    });
    (project.payments||[]).forEach(p => rows.push({
      id:p.id, date:p.date, kind:"payment",
      desc: p.note || "Payment",
      rate: p.rate!=null ? Number(p.rate) : null,
      units: p.units!=null ? Number(p.units) : null,
      amount: Number(p.amount)||0,
      file: p.file
    }));
    rows.sort((a,b) => (a.date||"").localeCompare(b.date||"") || String(a.id).localeCompare(String(b.id)));
    let bal = 0;
    rows.forEach(r => { bal += r.amount; r.balance = bal; });
    rows.reverse();
    return rows;
  }
  function ledgerTotals(rows){
    let charged=0, paid=0;
    rows.forEach(r => { if(r.amount < 0) paid += -r.amount; else charged += r.amount; });
    return { charged, paid, balance: charged-paid };
  }

  /* ---------- persistence ---------- */
  function queueSave(){
    project.updatedAt = Date.now();
    lastLocalWriteAt = project.updatedAt;
    renderAll();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
  }
  async function doSave(){
    const ok = await ensureFirebase();
    if(!ok) { toast("Can't reach sync — check connection"); return; }
    try{ await projRef(projectId).set(project); }
    catch(e){ toast("Save failed — will retry"); setTimeout(doSave, 3000); }
  }

  async function openProject(id){
    const ok = await ensureFirebase();
    if(!ok){ renderError("Couldn't connect to sync. Check your internet connection and reload."); return; }
    try{
      const snap = await projRef(id).get();
      if(!snap.exists){ renderError("This project link doesn't exist (it may have been removed)."); return; }
      project = snap.data();
      project.jobs = project.jobs || [];
      project.payments = project.payments || [];
      lastLocalWriteAt = project.updatedAt || 0;
      if(!isView) saveRecent(id, project.name, project.client, "edit");
      renderAll();
      projRef(id).onSnapshot(doc => {
        if(!doc.exists) return;
        const data = doc.data();
        if((data.updatedAt||0) > lastLocalWriteAt + 400){
          project = data; project.jobs = project.jobs || []; project.payments = project.payments || [];
          lastLocalWriteAt = data.updatedAt;
          renderAll();
        }
      });
    }catch(e){ renderError("Couldn't load this project. Check your internet connection and reload."); }
  }

  async function createProject(name, client){
    const ok = await ensureFirebase();
    if(!ok){ toast("Can't reach sync — check connection"); return; }
    const id = newProjectId();
    project = emptyProject(name, client);
    await projRef(id).set(project);
    saveRecent(id, project.name, project.client, "edit");
    location.href = "project.html?id=" + id;
  }

  /* ---------- rendering: landing ---------- */
  function renderLanding(){
    const recents = getRecents();
    let html = '<div class="phead"><div class="eyebrow">Job Tracker</div><div class="title">Projects</div>' +
      '<div class="sub">Track jobs, time &amp; materials — share a link with your client.</div></div>';
    if(recents.length){
      html += '<div class="plist">' + recents.map(r =>
        '<a class="prow" href="project.html?id='+esc(r.id)+(r.role==="view"?"&view=1":"")+'">' +
          '<div class="pn">'+esc(r.name||"Untitled Project")+'</div>' +
          '<div class="pc">'+esc(r.client||"")+(r.role==="view"?" · shared with you":"")+'</div>' +
        '</a>'
      ).join("") + '</div>';
    } else {
      html += '<div class="empty">No projects yet.</div>';
    }
    html += '<button class="btn primary" id="showNew">+ New Project</button>' +
      '<div class="newform" id="newForm" style="display:none">' +
        '<input id="npName" placeholder="Project name (e.g. Smith Residence)">' +
        '<input id="npClient" placeholder="Client name">' +
        '<button class="btn primary" id="createBtn">Create</button>' +
      '</div>';
    document.getElementById("app").innerHTML = html;
    document.getElementById("showNew").addEventListener("click", () => {
      document.getElementById("showNew").style.display = "none";
      document.getElementById("newForm").style.display = "block";
      document.getElementById("npName").focus();
    });
    document.getElementById("createBtn").addEventListener("click", () => {

  function qtyFmt(n){ n = Number(n)||0; return Math.round(n*100)/100+""; }

  function rateLabel(r){
    if(r.kind === "time"){
      if(!r.rate) return "";
      return esc(money(r.rate))+"/hr"+(r.hours?" &middot; "+esc(hrsFmt(r.hours)):"");
    }
    if(r.units!=null && r.rate!=null){
      return esc(qtyFmt(r.units))+" @ "+esc(money(r.rate));
    }
    return "";
  }

  function rateLabelPlain(r){
    if(r.kind === "time"){
      if(!r.rate) return "";
      return money(r.rate)+"/hr"+(r.hours?" · "+hrsFmt(r.hours):"");
    }
    if(r.units!=null && r.rate!=null){
      return qtyFmt(r.units)+" @ "+money(r.rate);
    }
    return "";
  }

  function csvCell(v){
    const s = String(v==null?"":v);
    return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }

  function downloadStatementCSV(rows, lt){
    const lines = [["Date","Description","Rate","Amount","Balance"].map(csvCell).join(",")];
    rows.forEach(r => {
      lines.push([dateFmt(r.date)||r.date, r.desc, rateLabelPlain(r), r.amount.toFixed(2), r.balance.toFixed(2)].map(csvCell).join(","));
    });
    lines.push("");
    lines.push(["","","Total Charged","",lt.charged.toFixed(2)].map(csvCell).join(","));
    lines.push(["","","Total Paid","",lt.paid.toFixed(2)].map(csvCell).join(","));
    lines.push(["","","Balance Due","",lt.balance.toFixed(2)].map(csvCell).join(","));

    const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (project.name||"Project").replace(/[\\/:*?"<>|]/g,"-");
    a.href = url;
    a.download = safeName+" - Cost Statement.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function dayHeaderFmt(s){
    if(!s) return "Undated";
    const p = s.split("-"); if(p.length!==3) return s;
    const d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
  }

  function groupLedgerByDay(rows){
    const byDate = [];
    let current = null;
    rows.forEach(r => {
      if(!current || current.date !== r.date){
        current = {date: r.date, rows: []};
        byDate.push(current);
      }
      current.rows.push(r);
    });
    const groups = [];
    byDate.forEach(bucket => {
      const charges = bucket.rows.filter(r => r.amount >= 0);
      const pays = bucket.rows.filter(r => r.amount < 0);
      if(charges.length) groups.push({date: bucket.date, rows: charges, total: charges.reduce((s,r)=>s+r.amount,0)});
      if(pays.length) groups.push({date: bucket.date, rows: pays, total: pays.reduce((s,r)=>s+r.amount,0)});
    });
    return groups;
  }

  /* ---------- events ---------- */
  function wireProjectEvents(shareUrl){
    const app = document.getElementById("app");

    if(!isView){
      const pName = document.getElementById("pName");
      pName.addEventListener("change", () => { project.name = pName.value.trim()||"Untitled Project"; saveRecent(projectId, project.name, project.client, "edit"); queueSave(); });

      const addJobBtn = document.getElementById("addJob");
      if(addJobBtn){
        addJobBtn.addEventListener("click", () => {
          const job = {id: uid(), title:"", status:"planned", notes:[], time:[], materials:[], tasks:[]};
          project.jobs.push(job);
          expanded.add(job.id);
          queueSave();
          setTimeout(() => {
            const el = document.querySelector('[data-jobtitle="'+job.id+'"]');
            if(el) el.focus();
          }, 0);
        });
      }

      document.getElementById("copyShare").addEventListener("click", () => copyText(shareUrl));

      const addPayBtn = document.getElementById("addPayBtn");
      if(addPayBtn){
        addPayBtn.addEventListener("click", () => {
          const date = document.getElementById("payDate").value || todayStr();
          const note = document.getElementById("payNote").value.trim();
          const units = Number(document.getElementById("payQty").value) || 1;
          const rate = Number(document.getElementById("payRate").value);
          if(!rate){ toast("Enter a rate"); return; }
          const amount = units * rate;
          project.payments = project.payments || [];
          project.payments.push({id: uid(), date, note, amount, units, rate});
          queueSave();
        });
      }
    }

    document.getElementById("printBtn").addEventListener("click", () => window.print());

    const downloadCsvBtn = document.getElementById("downloadCsvBtn");
    if(downloadCsvBtn){
      downloadCsvBtn.addEventListener("click", () => {
        const rows = buildLedger();
        downloadStatementCSV(rows, ledgerTotals(rows));
      });
    }

    app.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTab = btn.getAttribute("data-tab");
        renderAll();
      });
    });

    app.querySelectorAll("[data-jobhead]").forEach(h => {
      h.addEventListener("click", (e) => {
        if(e.target.closest("input")) return;
        const id = h.getAttribute("data-jobhead");
        if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
        renderAll();
      });
    });

    if(isView) return;

    app.querySelectorAll("[data-rmpay]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-rmpay");
        project.payments = (project.payments||[]).filter(p => p.id !== id);
        queueSave();
      });
    });

    app.querySelectorAll("[data-jobtitle]").forEach(inp => {
      inp.addEventListener("click", e => e.stopPropagation());
      inp.addEventListener("change", () => {
        const job = findJob(inp.getAttribute("data-jobtitle"));
        if(job){ job.title = inp.value.trim(); queueSave(); }
      });
    });

    app.querySelectorAll(".pill").forEach(p => {
      const card = p.closest(".job");
      if(!card) return;
      p.addEventListener("click", e => {
        e.stopPropagation();
        const id = card.getAttribute("data-jobcard");
        const job = findJob(id);
        if(!job) return;
        const order = ["planned","active","done"];
        const i = order.indexOf(job.status||"planned");
        job.status = order[(i+1) % order.length];
        queueSave();
      });
    });

    app.querySelectorAll("[data-noteinput]").forEach(inp => {
      inp.addEventListener("click", e => e.stopPropagation());
      inp.addEventListener("change", () => {
        const row = inp.closest(".ntrow");
        const job = findJob(row.getAttribute("data-job"));
        if(!job) return;
        const note = (job.notes||[]).find(n => n.id === row.getAttribute("data-noterow"));
        if(note){ note.text = inp.value.trim(); queueSave(); }
      });
    });

    app.querySelectorAll("[data-rmnote]").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const row = btn.closest(".ntrow");
        const job = findJob(row.getAttribute("data-job"));
        if(!job) return;
        job.notes = (job.notes||[]).filter(n => n.id !== row.getAttribute("data-noterow"));
        queueSave();
      });
    });

    app.querySelectorAll("[data-addnote]").forEach(row => {
      const jobId = row.getAttribute("data-addnote");
      const input = row.querySelector(".itext");
      const add = () => {
        const job = findJob(jobId); if(!job) return;
        const text = input.value.trim();
        if(!text) return;
        job.notes = job.notes || [];
        job.notes.push({id: uid(), text});
        queueSave();
      };
      row.querySelector(".iadd").addEventListener("click", add);
      input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); add(); } });
    });

    app.querySelectorAll("[data-pnoteinput]").forEach(inp => {
      inp.addEventListener("click", e => e.stopPropagation());
      inp.addEventListener("change", () => {
        const note = (project.notes||[]).find(n => n.id === inp.getAttribute("data-pnoteinput"));
        if(note){ note.text = inp.value.trim(); queueSave(); }
      });
    });

    app.querySelectorAll("[data-rmpnote]").forEach(btn => {
      btn.addEventListener("click", () => {
        const row = btn.closest(".ntrow");
        project.notes = (project.notes||[]).filter(n => n.id !== row.getAttribute("data-pnoterow"));
        queueSave();
      });
    });

    app.querySelectorAll("[data-addprojectnote]").forEach(row => {
      const input2 = row.querySelector(".itext");
      const add2 = () => {
        const text = input2.value.trim();
        if(!text) return;
        project.notes = project.notes || [];
        project.notes.push({id: uid(), text});
        queueSave();
      };
      row.querySelector(".iadd").addEventListener("click", add2);
      input2.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); add2(); } });
    });

    app.querySelectorAll("[data-fileupload]").forEach(inp => {
      inp.addEventListener("click", e => e.stopPropagation());
      inp.addEventListener("change", async () => {
        const label = inp.closest(".fileicon");
        const kind = label.getAttribute("data-filekind");
        const jobId = label.getAttribute("data-job");
        const itemId = label.getAttribute("data-item");
        const file = inp.files && inp.files[0];
        if(!file) return;
        let arr;
        if(kind==="payment"){
          arr = project.payments;
        } else {
          const job = findJob(jobId); if(!job) return;
          arr = kind==="task" ? job.tasks : kind==="note" ? job.notes : job.materials;
        }
        const item = (arr||[]).find(x => x.id === itemId);
        if(!item) return;
        toast("Uploading…");
        const uploaded = await uploadFile(file, jobId);
        if(uploaded){ item.file = uploaded; queueSave(); toast("Uploaded"); }
        else { toast("Upload failed — check connection"); }
      });
    });

    app.querySelectorAll("[data-deljob]").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const id = btn.getAttribute("data-deljob");
        const job = findJob(id);
        if(!job) return;
        if(!confirm('Delete job "'+(job.title||"Untitled Job")+'" and all its logged entries?')) return;
        project.jobs = project.jobs.filter(j => j.id !== id);
        queueSave();
      });
    });

    app.querySelectorAll("[data-add]").forEach(row => {
      const kind = row.getAttribute("data-add");
      const jobId = row.getAttribute("data-job");
      row.querySelector(".iadd").addEventListener("click", () => {
        const job = findJob(jobId); if(!job) return;
        const date = row.querySelector(".idate").value || todayStr();
        const entry = {id: uid(), date};
        if(kind === "time"){
          const nums = row.querySelectorAll(".inum");
          const hours = Number(nums[0].value);
          if(!hours || hours<=0){ toast("Enter hours"); return; }
          entry.hours = hours;
          entry.rate = Number(nums[1].value)||0;
          entry.desc = row.querySelector(".itext").value.trim();
        } else {
          const cost = Number(row.querySelector(".inum").value)||0;
          const desc = row.querySelector(".itext").value.trim();
          if(!desc && !cost){ toast("Enter a description or cost"); return; }
          entry.desc = desc; entry.cost = cost;
        }
        job[kind] = job[kind] || [];
        job[kind].push(entry);
        queueSave();
      });
    });

    app.querySelectorAll("[data-rm]").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const row = btn.closest(".erow");
        const kind = row.getAttribute("data-kind");
        const job = findJob(row.getAttribute("data-job"));
        if(!job) return;
        job[kind] = (job[kind]||[]).filter(x => x.id !== row.getAttribute("data-entry"));
        queueSave();
      });
    });

    app.querySelectorAll("[data-taskbox]").forEach(box => {
      box.addEventListener("click", e => {
        e.stopPropagation();
        const row = box.closest(".trow");
        const job = findJob(row.getAttribute("data-job"));
        if(!job) return;
        const task = (job.tasks||[]).find(t => t.id === row.getAttribute("data-taskrow"));
        if(!task) return;
        task.done = !task.done;
        queueSave();
      });
    });

    app.querySelectorAll("[data-rmtask]").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const row = btn.closest(".trow");
        const job = findJob(row.getAttribute("data-job"));
        if(!job) return;
        job.tasks = (job.tasks||[]).filter(t => t.id !== row.getAttribute("data-taskrow"));
        queueSave();
      });
    });

    app.querySelectorAll("[data-addtask]").forEach(row => {
      const jobId = row.getAttribute("data-addtask");
      const input = row.querySelector(".itext");
      const add = () => {
        const job = findJob(jobId); if(!job) return;
        const text = input.value.trim();
        if(!text) return;
        job.tasks = job.tasks || [];
        job.tasks.push({id: uid(), text, done:false});
        queueSave();
      };
      row.querySelector(".iadd").addEventListener("click", add);
      input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); add(); } });
    });
  }

  function findJob(id){ return (project.jobs||[]).find(j => j.id === id); }

  /* ---------- boot ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    if(projectId){
      openProject(projectId);
    } else {
      renderLanding();
    }
  });
})();
</script>
</body>
</html>
